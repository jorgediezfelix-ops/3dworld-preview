<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="Línea de tiempo con cuatro etapas de mantenimiento: cada impresión, cada semana, cada 200 horas y cada 500 horas." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Línea de tiempo con cuatro etapas de mantenimiento: cada impresión, cada semana, cada 200 horas y cada 500 horas.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="210" fill="#0e1a21"/><rect width="640" height="210" fill="url(#grid)"/><line x1="70" y1="96" x2="570" y2="96" stroke="#2c4351" stroke-width="3"/><circle cx="80" cy="96" r="10" fill="#0e1a21" stroke="#b8daee" stroke-width="2" /><circle cx="80" cy="96" r="4" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".7"/><text x="80" y="52" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="600">Cada impresión</text><text x="80" y="150.0" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">Placa limpia,</text><text x="80" y="169.5" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">primera capa</text><circle cx="240" cy="96" r="14" fill="#0e1a21" stroke="#b8daee" stroke-width="2" /><circle cx="240" cy="96" r="8" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".7"/><text x="240" y="52" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="600">Cada semana</text><text x="240" y="150.0" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">Lavar placa,</text><text x="240" y="169.5" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">limpiar cabezal</text><circle cx="400" cy="96" r="18" fill="#0e1a21" stroke="#b8daee" stroke-width="2" /><circle cx="400" cy="96" r="12" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".7"/><text x="400" y="52" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="600">200 horas</text><text x="400" y="150.0" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">Ejes, correas,</text><text x="400" y="169.5" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">ventiladores</text><circle cx="560" cy="96" r="22" fill="#0e1a21" stroke="#b8daee" stroke-width="2" /><circle cx="560" cy="96" r="16" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".7"/><text x="560" y="52" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="600">500 horas</text><text x="560" y="150.0" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">Lubricar, boquilla,</text><text x="560" y="169.5" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">firmware</text></svg>
