<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Cinco reglas de diseño dibujadas con su medida: pared, pilar, relieve, grabado y orificio de drenaje." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Cinco reglas de diseño dibujadas con su medida: pared, pilar, relieve, grabado y orificio de drenaje.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="280" fill="#0e1a21"/><rect width="640" height="280" fill="url(#grid)"/><rect x="40" y="190" width="70" height="10" rx="0" fill="#2f6fd6" stroke="#b8daee" stroke-width="1" fill-opacity=".35"/><rect x="70" y="90" width="8" height="100" rx="0" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.2" fill-opacity=".6"/><text x="76" y="236" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="600