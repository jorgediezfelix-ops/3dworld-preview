<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Cuatro ranuras con su filamento y su perfil: temperatura, flujo y velocidad volumétrica máxima de cada uno." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Cuatro ranuras con su filamento y su perfil: temperatura, flujo y velocidad volumétrica máxima de cada uno.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="280" fill="#0e1a21"/><rect width="640" height="280" fill="url(#grid)"/><rect x="16" y="40" width="142" height="150" rx="10" fill="#13232c" stroke="#2c4351" stroke-width="1.4" /><circle cx="42" cy="70" r="12" fill="#14181b" stroke="#a9bcc7" stroke-width="1" /><text x="62" y="75" font-size="13" fill="#7f97a5" text-anchor="start" font-weight="400">Ranura 1</text><text x="28" y="112" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="600">PLA mate negro</text><text x="28" y="136" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">215 °C · flujo 0.98</text><text x="28" y="168" font-size="16" fill="#eef4f7" text-anchor="start" font-weight="600">18 mm³/s</text><rect x="170" y="40" width="142" height="150" rx="10" fill="#13232c" stroke="#b8daee" stroke-width="1.4" /><circle cx="196" cy="70" r="12" fill="#f2f4f5" stroke="#a9bcc7" stroke-width="1" /><text x="216" y="75" font-size="13" fill="#7f97a5" text-anchor="start" font-weight="400">Ranura 2</text><text x="182" y="112" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="600">PLA seda blanco</text><text x="182" y="136" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">225 °C · flujo 0.95</text><text x="182" y="168" font-size="16" fill="#b8daee" text-anchor="start" font-weight="600">10 mm³/s</text><rect x="324" y="40" width="142" height="150" rx="10" fill="#13232c" stroke="#2c4351" stroke-width="1.4" /><circle cx="350" cy="70" r="12" fill="#8a96a0" stroke="#a9bcc7" stroke-width="1" /><text x="370" y="75" font-size="13" fill="#7f97a5" text-anchor="start" font-weight="400">Ranura 3</text><text x="336" y="112" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="600">PETG gris</text><text x="336" y="136" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">240 °C · flujo 0.96</text><text x="336" y="168" font-size="16" fill="#eef4f7" text-anchor="start" font-weight="600">12 mm³/s</text><rect x="478" y="40" width="142" height="150" rx="10" fill="#13232c" stroke="#2c4351" stroke-width="1.4" /><circle cx="504" cy="70" r="12" fill="#d65a4a" stroke="#a9bcc7" stroke-width="1" /><text x="524" y="75" font-size="13" fill="#7f97a5" text-anchor="start" font-weight="400">Ranura 4</text><text x="490" y="112" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="600">TPU 95A rojo</text><text x="490" y="136" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">225 °C · flujo 1.02</text><text x="490" y="168" font-size="16" fill="#eef4f7" text-anchor="start" font-weight="600">4 mm³/s</text><path d="M163 196C163 230 250 236 320 236" fill="none" stroke="#7f97a5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M240 196C240 220 290 230 320 236" fill="none" stroke="#b8daee" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="330" y="234.0" font-size="14" fill="#b8daee" text-anchor="start" font-weight="400">Capa con negro y blanco: 10 mm³/s,</text><text x="330" y="252.2" font-size="14" fill="#b8daee" text-anchor="start" font-weight="400">manda el filamento más lento</text></svg>
