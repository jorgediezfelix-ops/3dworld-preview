<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Animación: la cota del ancho de una placa cambia de 80 a 120 mm; la placa se alarga y el barreno se mueve para seguir centrado." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" class="ac"><title>Animación: la cota del ancho de una placa cambia de 80 a 120 mm; la placa se alarga y el barreno se mueve para seguir centrado.</title><style>@keyframes ac-grow{0.00%{transform:scaleX(1)}30.00%{transform:scaleX(1)}42.00%{transform:scaleX(1.5)}72.00%{transform:scaleX(1.5)}84.00%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}@keyframes ac-half{0.00%{transform:translateX(0)}30.00%{transform:translateX(0)}42.00%{transform:translateX(60px)}72.00%{transform:translateX(60px)}84.00%{transform:translateX(0)}100.00%{transform:translateX(0)}}@keyframes ac-full{0.00%{transform:translateX(0)}30.00%{transform:translateX(0)}42.00%{transform:translateX(120px)}72.00%{transform:translateX(120px)}84.00%{transform:translateX(0)}100.00%{transform:translateX(0)}}@keyframes ac-a{0.00%{opacity:1}34.00%{opacity:1}40.00%{opacity:0}76.00%{opacity:0}82.00%{opacity:1}100.00%{opacity:1}}@keyframes ac-b{0.00%{opacity:0}34.00%{opacity:0}40.00%{opacity:1}76.00%{opacity:1}82.00%{opacity:0}100.00%{opacity:0}}.ac .ac-plate{transform-origin:120px 0;animation:ac-grow 8s ease-in-out infinite}.ac .ac-hole{animation:ac-half 8s ease-in-out infinite}.ac .ac-end{animation:ac-full 8s ease-in-out infinite}.ac .ac-mid{animation:ac-half 8s ease-in-out infinite}.ac .ac-va{animation:ac-a 8s infinite}.ac .ac-vb{opacity:0;animation:ac-b 8s infinite}</style><defs><pattern id="ac-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="300" fill="#0e1a21"/><rect width="640" height="300" fill="url(#ac-grid)"/><rect class="ac-plate" x="120" y="110" width="240" height="110" fill="#2f6fd6" fill-opacity=".18" stroke="#eef4f7" stroke-width="2"/><g class="ac-hole"><circle cx="240.0" cy="165.0" r="20" fill="#0e1a21" stroke="#eef4f7" stroke-width="2" /><line x1="212.0" y1="165.0" x2="268.0" y2="165.0" stroke="#7f97a5" stroke-width="1" stroke-dasharray="4 3"/><line x1="240.0" y1="137.0" x2="240.0" y2="193.0" stroke="#7f97a5" stroke-width="1" stroke-dasharray="4 3"/></g><line x1="120" y1="226" x2="120" y2="262" stroke="#7f97a5" stroke-width="1" stroke-dasharray="3 3"/><line x1="120" y1="254" x2="130" y2="254" stroke="#b8daee" stroke-width="1.3"/><rect class="ac-plate" x="120" y="253.35" width="240" height="1.3" fill="#b8daee"/><g class="ac-end"><line x1="360" y1="226" x2="360" y2="262" stroke="#7f97a5" stroke-width="1" stroke-dasharray="3 3"/><path d="M360 254l-9 -5v10z" fill="#b8daee" stroke="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /></g><path d="M120 254l9 -5v10z" fill="#b8daee" stroke="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /><g class="ac-mid"><text class="ac-va" x="240.0" y="245" font-size="16" fill="#b8daee" text-anchor="middle" font-weight="600">80 mm</text><text class="ac-vb" x="240.0" y="245" font-size="16" fill="#f0c27a" text-anchor="middle" font-weight="600">120 mm</text></g><text x="40" y="44" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Modelo paramétrico</text><text x="40" y="66" font-size="14" fill="#a9bcc7" text-anchor="start" font-weight="400">Cambias la cota y la pieza se actualiza; el barreno sigue centrado</text><rect x="486" y="104" width="120" height="30" rx="6" fill="#0e1a21" stroke="#2c4351" stroke-width="1.5" /><text x="546" y="124" font-size="13" fill="#a9bcc7" text-anchor="middle" font-weight="400">Restricción</text><rect x="486" y="140" width="120" height="30" rx="6" fill="#0e1a21" stroke="#b8daee" stroke-width="1.5" /><text x="546" y="160" font-size="13" fill="#b8daee" text-anchor="middle" font-weight="400">Centro = ½ ancho</text></svg>
