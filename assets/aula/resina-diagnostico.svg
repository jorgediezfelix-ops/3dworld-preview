<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Cinco pasos numerados de diagnóstico en orden: exposición, temperatura, fuerza de despegue, soportes y nivelación, con la pregunta clave de cada uno." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Cinco pasos numerados de diagnóstico en orden: exposición, temperatura, fuerza de despegue, soportes y nivelación, con la pregunta clave de cada uno.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="300" fill="#0e1a21"/><rect width="640" height="300" fill="url(#grid)"/><line x1="54" y1="46" x2="54" y2="270" stroke="#2c4351" stroke-width="2"/><circle cx="54" cy="46" r="17" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" /><text x="54" y="52" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="700">1</text><text x="88" y="44" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Exposición</text><text x="88" y="66" font-size="15" fill="#a9bcc7" text-anchor="start" font-weight="400">¿Salen completos los detalles y las capas?</text><circle cx="54" cy="102" r="17" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" /><text x="54" y="108" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="700">2</text><text x="88" y="100" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Temperatura</text><text x="88" y="122" font-size="15" fill="#a9bcc7" text-anchor="start" font-weight="400">¿La resina está entre 20 y 30 °C?</text><circle cx="54" cy="158" r="17" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" /><text x="54" y="164" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="700">3</text><text x="88" y="156" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Fuerza de despegue</text><text x="88" y="178" font-size="15" fill="#a9bcc7" text-anchor="start" font-weight="400">¿Hay capas con área grande?</text><circle cx="54" cy="214" r="17" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" /><text x="54" y="220" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="700">4</text><text x="88" y="212" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Soportes</text><text x="88" y="234" font-size="15" fill="#a9bcc7" text-anchor="start" font-weight="400">¿Están sostenidas las islas y los puntos bajos?</text><circle cx="54" cy="270" r="17" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" /><text x="54" y="276" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="700">5</text><text x="88" y="268" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Nivelación</text><text x="88" y="290" font-size="15" fill="#a9bcc7" text-anchor="start" font-weight="400">¿Se pegó la base a la plataforma?</text></svg>
