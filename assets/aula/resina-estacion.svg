<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Vista superior de una mesa de trabajo dividida en zona sucia, con la impresora y los recipientes de lavado, y zona limpia, con la estación de curado y el área de acabado; una flecha de ventilación sale hacia la ventana." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Vista superior de una mesa de trabajo dividida en zona sucia, con la impresora y los recipientes de lavado, y zona limpia, con la estación de curado y el área de acabado; una flecha de ventilación sale hacia la ventana.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="320" fill="#0e1a21"/><rect width="640" height="320" fill="url(#grid)"/><rect x="30" y="50" width="580" height="250" rx="8" fill="#13232c" stroke="#2c4351" stroke-width="1.5" /><rect x="30" y="50" width="300" height="250" rx="8" fill="#f0c27a" stroke="none" stroke-width="1.5" fill-opacity=".06"/><line x1="330" y1="50" x2="330" y2="300" stroke="#f0c27a" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="80" font-size="17" fill="#f0c27a" text-anchor="start" font-weight="600">Zona sucia</text><text x="346" y="80" font-size="17" fill="#b8daee" text-anchor="start" font-weight="600">Zona limpia</text><rect x="56" y="110" width="110" height="110" rx="6" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="111.0" y="170.0" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">Impresora</text><rect x="196" y="104" width="110" height="62" rx="6" fill="#0e1a21" stroke="#f0c27a" stroke-width="1.4" /><text x="251.0" y="131.0" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">Lavado 1</text><text x="251.0" y="150.5" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">sucio</text><rect x="196" y="196" width="110" height="62" rx="6" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="251.0" y="223.0" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">Lavado 2</text><text x="251.0" y="242.5" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">limpio</text><rect x="360" y="150" width="110" height="80" rx="6" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="415.0" y="195.0" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">Curado UV</text><rect x="490" y="150" width="100" height="80" rx="6" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="540.0" y="195.0" font-size="15" fill="#eef4f7" text-anchor="middle" font-weight="400">Acabado</text><line x1="166" y1="150" x2="192" y2="140" stroke="#a9bcc7" stroke-width="1.4" marker-end="url(#as)"/><line x1="251" y1="166" x2="251" y2="192" stroke="#a9bcc7" stroke-width="1.4" marker-end="url(#as)"/><line x1="306" y1="227" x2="356" y2="200" stroke="#a9bcc