<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-label="Animación: dos piezas de ABS se enfrían. Al aire, el aire frío contrae la pieza y sus extremos se levantan de la cama; dentro de una cámara cerrada y caliente la pieza se queda plana." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif" class="aw"><title>Animación: dos piezas de ABS se enfrían. Al aire, el aire frío contrae la pieza y sus extremos se levantan de la cama; dentro de una cámara cerrada y caliente la pieza se queda plana.</title><style>@keyframes aw-left{0.00%{transform:rotate(0deg)}12.00%{transform:rotate(0deg)}70.00%{transform:rotate(9deg)}92.00%{transform:rotate(9deg)}100.00%{transform:rotate(0deg)}}@keyframes aw-right{0.00%{transform:rotate(0deg)}12.00%{transform:rotate(0deg)}70.00%{transform:rotate(-9deg)}92.00%{transform:rotate(-9deg)}100.00%{transform:rotate(0deg)}}@keyframes aw-cool{0.00%{fill:#e8875b}12.00%{fill:#e8875b}70.00%{fill:#2f6fd6}92.00%{fill:#2f6fd6}100.00%{fill:#e8875b}}@keyframes aw-air{0.00%{transform:translateX(60px);opacity:0}15.00%{opacity:1}85.00%{opacity:1}100.00%{transform:translateX(-120px);opacity:0}}@keyframes aw-rise{0.00%{transform:translateY(16px);opacity:0}20.00%{opacity:1}80.00%{opacity:1}100.00%{transform:translateY(-34px);opacity:0}}.aw .aw-l{transform-origin:100px 226px;transform:rotate(9deg);animation:aw-left 8s ease-in-out infinite}.aw .aw-r{transform-origin:220px 226px;transform:rotate(-9deg);animation:aw-right 8s ease-in-out infinite}.aw .aw-part{fill:#2f6fd6;animation:aw-cool 8s ease-in-out infinite}.aw .aw-air{animation:aw-air 2.6s linear infinite}.aw .aw-rise{animation:aw-rise 2.8s linear infinite}</style><defs><pattern id="aw-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="290" fill="#0e1a21"/><rect width="640" height="290" fill="url(#aw-grid)"/><line x1="320" y1="30" x2="320" y2="280" stroke="#2c4351" stroke-width="1"/><rect x="40" y="226" width="240" height="10" rx="0" fill="#1c3442" stroke="#2c4351" stroke-width="1.5" /><rect class="aw-part" x="100" y="196" width="120" height="30" fill-opacity=".55" stroke="#b8daee" stroke-width="1.2"/><rect class="aw-l aw-part" x="70" y="196" width="30" height="30" fill-opacity=".55" stroke="#b8daee" stroke-width="1.2"/><rect class="aw-r aw-part" x="220" y="196" width="30" height="30" fill-opacity=".55" stroke="#b8daee" stroke-width="1.2"/><g class="aw-air" style="animation-delay:0.0s"><line x1="250" y1="120" x2="200" y2="120" stroke="#2f6fd6" stroke-width="2" marker-end="url(#ab)"/></g><g class="aw-air" style="animation-delay:-0.9s"><line x1="250" y1="142" x2="200" y2="142" stroke="#2f6fd6" stroke-width="2" marker-end="url(#ab)"/></g><g class="aw-air" style="animation-delay:-1.8s"><line x1="250" y1="164" x2="200" y2="164" stroke="#2f6fd6" stroke-width="2" marker-end="url(#ab)"/></g><circle cx="52" cy="34" r="11" fill="#0e1a21" stroke="#f0c27a" stroke-width="1.6" /><path d="M47.6 29.6l8.8 8.8M56.4 29.6l-8.8 8.8" fill="none" stroke="#f0c27a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="72" y="40" font-size="17" fill="#f0c27a" text-anchor="start" font-weight="600">Al aire</text><text x="40" y="268" font-size="14" fill="#a9bcc7" text-anchor="start" font-weight="400">El aire frío contrae las capas de arriba</text><rect x="360" y="96" width="250" height="150" rx="8" fill="#e8875b" stroke="#a9bcc7" stroke-width="2" fill-opacity=".07"/><rect x="372" y="226" width="226" height="10" rx="0" fill="#1c3442" stroke="#2c4351" stroke-width="1.5" /><rect x="425" y="196" width="120" height="30" fill="#e8875b" fill-opacity=".45" stroke="#b8daee" stroke-width="1.2"/><g class="aw-rise" style="animation-delay:0.0s"><path d="M400 190c-6 -8 6 -14 0 -22s6 -14 0 -22" fill="none" stroke="#f0c27a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /></g><g class="aw-rise" style="animation-delay:-0.9s"><path d="M470 190c-6 -8 6 -14 0 -22s6 -14 0 -22" fill="none" stroke="#f0c27a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /></g><g class="aw-rise" style="animation-delay:-1.8s"><path d="M540 190c-6 -8 6 -14 0 -22s6 -14 0 -22" fill="none" stroke="#f0c27a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" /></g><circle cx="372" cy="34" r="11" fill="#0e1a21" stroke="#b8daee" stroke-width="1.6" /><path d="M367.05 34l3.3 3.52l6.6 -7.699999999999999" fill="none" stroke="#b8daee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="392" y="40" font-size="17" fill="#b8daee" text-anchor="start" font-weight="600">En cámara cerrada</text><text x="360" y="268" font-size="14" fill="#a9bcc7" text-anchor="start" font-weight="400">Se enfría parejo 