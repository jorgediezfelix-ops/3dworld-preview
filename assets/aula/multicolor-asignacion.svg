<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Tres formas de asignar color: por objeto o parte, pintando zonas de una pieza y por altura con cambios en capas específicas." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Tres formas de asignar color: por objeto o parte, pintando zonas de una pieza y por altura con cambios en capas específicas.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="300" fill="#0e1a21"/><rect width="640" height="300" fill="url(#grid)"/><circle cx="32" cy="34" r="12" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".85"/><text x="32" y="39" font-size="13" fill="#eef4f7" text-anchor="middle" font-weight="700">1</text><text x="52" y="40" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Por parte</text><rect x="20" y="220" width="180" height="9" rx="0" fill="#1c3442" stroke="#2c4351" stroke-width="1.5" /><rect x="38" y="140" width="66" height="80" rx="3" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.3" fill-opacity=".55"/><path d="M124 220V112Q124 100 148 100Q172 100 172 112V220Z" fill="#f0c27a" stroke="#f0c27a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" fill-opacity=".5"/><text x="110" y="254.0" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">Cambios en</text><text x="110" y="272.2" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">cada capa</text><circle cx="242" cy="34" r="12" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".85"/><text x="242" y="39" font-size="13" fill="#eef4f7" text-anchor="middle" font-weight="700">2</text><text x="262" y="40" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Pintar zonas</text><rect x="230" y="220" width="180" height="9" rx="0" fill="#1c3442" stroke="#2c4351" stroke-width="1.5" /><rect x="248" y="110" width="144" height="110" rx="6" fill="#b8daee" stroke="#b8daee" stroke-width="1.3" fill-opacity=".22"/><circle cx="320" cy="162" r="26" fill="#f0c27a" stroke="none" stroke-width="1.5" fill-opacity=".75"/><circle cx="320" cy="162" r="10" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".9"/><line x1="390" y1="84" x2="366" y2="112" stroke="#c9a45c" stroke-width="4"/><circle cx="363" cy="116" r="5" fill="#f0c27a" stroke="none" stroke-width="1.5" /><text x="320" y="254.0" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">Cambios en las</text><text x="320" y="272.2" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">capas pintadas</text><circle cx="452" cy="34" r="12" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".85"/><text x="452" y="39" font-size="13" fill="#eef4f7" text-anchor="middle" font-weight="700">3</text><text x="472" y="40" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Por altura</text><rect x="440" y="220" width="180" height="9" rx="0" fill="#1c3442" stroke="#2c4351" stroke-width="1.5" /><rect x="458" y="165" width="144" height="55" rx="0" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.3" fill-opacity=".55"/><rect x="458" y="110" width="144" height="55" rx="0" fill="#f0c27a" stroke="#f0c27a" stroke-width="1.3" fill-opacity=".5"/><line x1="448" y1="165" x2="612" y2="165" stroke="#eef4f7" stroke-width="1.2" stroke-dasharray="5 4"/><text x="530" y="158" font-size="12" fill="#eef4f7" text-anchor="middle" font-weight="400">cambio en la capa 41</text><text x="530" y="254.0" font-size="14" fill="#b8daee" text-anchor="middle" font-weight="400">Un solo cambio</text><text x="530" y="272.2" font-size="14" fill="#b8daee" text-anchor="middle" font-weight="400">en todo el trabajo</text></svg>
