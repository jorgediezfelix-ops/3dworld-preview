<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Árbol de decisión para la subextrusión: pregunta por el filamento, luego por el extrusor, luego por la boquilla y luego por la temperatura." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Árbol de decisión para la subextrusión: pregunta por el filamento, luego por el extrusor, luego por la boquilla y luego por la temperatura.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="400" fill="#0e1a21"/><rect width="640" height="400" fill="url(#grid)"/><text x="40" y="30" font-size="17" fill="#eef4f7" text-anchor="start" font-weight="600">Subextrusión</text><rect x="40" y="50" width="300" height="44" rx="10" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="56" y="78" font-size="15" fill="#eef4f7" text-anchor="start" font-weight="400">¿Filamento seco y rollo libre?</text><line x1="340" y1="72" x2="396" y2="72" stroke="#f0c27a" stroke-width="1.4" marker-end="url(#aw)"/><text x="368" y="64" font-size="12" fill="#f0c27a" text-anchor="middle" font-weight="400">No</text><rect x="400" y="50" width="210" height="44" rx="10" fill="#1b1912" stroke="#f0c27a" stroke-width="1.2" /><text x="414" y="78" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="400">Seca el rollo o libéralo</text><line x1="190" y1="94" x2="190" y2="120" stroke="#b8daee" stroke-width="1.4" marker-end="url(#a)"/><text x="200" y="112" font-size="12" fill="#b8daee" text-anchor="start" font-weight="400">Sí</text><rect x="40" y="122" width="300" height="44" rx="10" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="56" y="150" font-size="15" fill="#eef4f7" text-anchor="start" font-weight="400">¿Los engranes empujan sin patinar?</text><line x1="340" y1="144" x2="396" y2="144" stroke="#f0c27a" stroke-width="1.4" marker-end="url(#aw)"/><text x="368" y="136" font-size="12" fill="#f0c27a" text-anchor="middle" font-weight="400">No</text><rect x="400" y="122" width="210" height="44" rx="10" fill="#1b1912" stroke="#f0c27a" stroke-width="1.2" /><text x="414" y="150" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="400">Limpia y ajusta el extrusor</text><line x1="190" y1="166" x2="190" y2="192" stroke="#b8daee" stroke-width="1.4" marker-end="url(#a)"/><text x="200" y="184" font-size="12" fill="#b8daee" text-anchor="start" font-weight="400">Sí</text><rect x="40" y="194" width="300" height="44" rx="10" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="56" y="222" font-size="15" fill="#eef4f7" text-anchor="start" font-weight="400">¿Sale bien al extruir a mano?</text><line x1="340" y1="216" x2="396" y2="216" stroke="#f0c27a" stroke-width="1.4" marker-end="url(#aw)"/><text x="368" y="208" font-size="12" fill="#f0c27a" text-anchor="middle" font-weight="400">No</text><rect x="400" y="194" width="210" height="44" rx="10" fill="#1b1912" stroke="#f0c27a" stroke-width="1.2" /><text x="414" y="222" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="400">Destapa o cambia la boquilla</text><line x1="190" y1="238" x2="190" y2="264" stroke="#b8daee" stroke-width="1.4" marker-end="url(#a)"/><text x="200" y="256" font-size="12" fill="#b8daee" text-anchor="start" font-weight="400">Sí</text><rect x="40" y="266" width="300" height="44" rx="10" fill="#0e1a21" stroke="#b8daee" stroke-width="1.4" /><text x="56" y="294" font-size="15" fill="#eef4f7" text-anchor="start" font-weight="400">¿Funciona el ventilador del disipador?</text><line x1="340" y1="288" x2="396" y2="288" stroke="#f0c27a" stroke-width="1.4" marker-end="url(#aw)"/><text x="368" y="280" font-size="12" fill="#f0c27a" text-anchor="middle" font-weight="400">No</text><rect x="400" y="266" width="210" height="44" rx="10" fill="#1b1912" stroke="#f0c27a" stroke-width="1.2" /><text x="414" y="294" font-size="14" fill="#eef4f7" text-anchor="start" font-weight="400">Cambia el ventilador</text><line x1="190" y1="310" x2="190" y2="336" stroke="#b8daee" stroke-width="1.4" marker-end="url(#a)"/><text x="200" y="328" font-size="12" fill="#b8daee" text-anchor="start" font-weight="400">Sí</text><rect x="40" y="338" width="300" height="40" rx="10" fill="#0e1a21" stroke="#a9bcc7" stroke-width="1.2" stroke-dasharray="4 3"/><text x="56" y="364" font-size="14" fill="#a9bcc7" text-anchor="start" font-weight="400">Revisa temperatura y termistor</text></svg>
