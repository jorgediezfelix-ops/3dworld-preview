<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-label="Bloque que representa un tramo de línea de 0.45 mm de ancho y 0.2 mm de alto avanzando a 200 mm/s, con el cálculo de 18 mm³/s." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Bloque que representa un tramo de línea de 0.45 mm de ancho y 0.2 mm de alto avanzando a 200 mm/s, con el cálculo de 18 mm³/s.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="350" fill="#0e1a21"/><rect width="640" height="350" fill="url(#grid)"/><path d="M100 120l200 -70h120l-200 70Z" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" fill-opacity=".45"/><path d="M220 120l200 -70v54l-200 70Z" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" fill-opacity=".3"/><rect x="100" y="120" width="120" height="54" rx="0" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" fill-opacity=".7"/><line x1="100" y1="200" x2="220" y2="200" stroke="#b8daee" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/><text x="160.0" y="219" font-size="15" fill="#b8daee" text-anchor="middle" font-weight="400">ancho 0.45 mm</text><line x1="86" y1="120" x2="86" y2="174" stroke="#b8daee" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#a)"/><text x="77" y="152.0" font-size="14" fill="#b8daee" text-anchor="end" font-weight="400">alto 0.2 mm</text><line x1="234" y1="182" x2="374.0" y2="133.0" stroke="#b8daee" stroke-width="1.4" marker-end="url(#a)"/><text x="384.0" y="139.0" font-size="15" fill="#b8daee" text-anchor="start" font-weight="400">200 mm/s</text><text x="446" y="52" font-size="19" fill="#eef4f7" text-anchor="start" font-weight="600">0.45 × 0.2 × 200</text><text x="446" y="84" font-size="25" fill="#b8daee" text-anchor="start" font-weight="600">= 18 mm³/s</text><rect x="70" y="268" width="520" height="16" rx="8" fill="#13232c" stroke="#2c4351" stroke-width="1.5" /><rect x="200.0" y="268" width="65.0" height="16" rx="8" fill="#b8daee" stroke="none" stroke-width="1.5" fill-opacity=".55"/><rect x="395.0" y="268" width="130.0" height="16" rx="8" fill="#2f6fd6" stroke="none" stroke-width="1.5" fill-opacity=".8"/><text x="232.5" y="258" font-size="14" fill="#b8daee" text-anchor="middle" font-weight="400">hotend estándar</text><text x="460.0" y="258" font-size="14" fill="#b8daee" text-anchor="middle" font-weight="400">alto flujo</text><line x1="304.0" y1="262" x2="304.0" y2="292" stroke="#f0c27a" stroke-width="2.4"/><text x="304.0" y="310" font-size="15" fill="#f0c27a" text-anchor="middle" font-weight="600">18</text><text x="70.0" y="310" font-size="13" fill="#7f97a5" text-anchor="middle" font-weight="400">0</text><text x="200.0" y="310" font-size="13" fill="#7f97a5" text-anchor="middle" font-wei