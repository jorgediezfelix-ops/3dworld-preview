<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-label="Pieza de prueba con barrenos de 5, 8 y 10 mm y la medida real de cada uno, todos un poco más chicos que el valor del modelo." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Pieza de prueba con barrenos de 5, 8 y 10 mm y la medida real de cada uno, todos un poco más chicos que el valor del modelo.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="290" fill="#0e1a21"/><rect width="640" height="290" fill="url(#grid)"/><rect x="40" y="70" width="360" height="170" rx="8" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" fill-opacity=".22"/><circle cx="110" cy="150" r="18.5" fill="#0e1a21" stroke="#7f97a5" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="110" cy="150" r="14.5" fill="#0e1a21" stroke="#f0c27a" stroke-width="1.8" /><text x="110" y="208" font-size="14" fill="#7f97a5" text-anchor="middle" font-weight="400">5.00</text><text x="110" y="228" font-size="15" fill="#f0c27a" text-anchor="middle" font-weight="600">→ 4.78 mm</text><circle cx="210" cy="150" r="26.0" fill="#0e1a21" stroke="#7f97a5" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="210" cy="150" r="22.0" fill="#0e1a21" stroke="#f0c27a" stroke-width="1.8" /><text x="210" y="208" font-size="14" fill="#7f97a5" text-anchor="middle" font-weight="400">8.00</text><text x="210" y="228" font-size="15" fill="#f0c27a" text-anchor="middle" font-weight="600">→ 7.80 mm</text><circle cx="320" cy="150" r="31.0" fill="#0e1a21" stroke="#7f97a5" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="320" cy="150" r="27.0" fill="#0e1a21" stroke="#f0c27a" stroke-width="1.8" /><text x="320" y="208" font-size="14" fill="#7f97a5" text-anchor="middle" font-weight="400">10.00</text><text x="320" y="228" font-size="15" fill="#f0c27a" text-anchor="middle" font-weight="600">→ 9.72 mm</text><rect x="460" y="96" width="108" height="108" rx="0" fill="none" stroke="#7f97a5" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="456" y="92" width="116" height="116" rx="0" fill="none" stroke="#b8daee" stroke-width="1.8" /><text x="514" y="232" font-size="15" fill="#b8daee" text-anchor="middle" font-weight="600">20.00 → 20.08 mm</text><text x="514" y="154" font-size="15" fill="#a9bcc7" text-anchor="middle" font-weight="400">Cubo</text><rect x="40" y="268" width="14" height="3" rx="0" fill="#7f97a5" stroke="none" stroke-width="1.5" /><text x="62" y="274" font-size="13" fill="#7f97a5" text-anchor="start" font-weight="400">Medida del modelo</text><rect x="200" y="266" width="14" height="6" rx="0" fill="#f0c27a" stroke="none" stroke-width="1.5" /><text x="222" y="274" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">Medida impresa (diferencia exagerada)</text><text x="40" y="50" font-size="15" fill="#a9bcc7" text-anchor="start" font-weight="400">Barrenos</text></svg>
