<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Curva de temperatura contra tiempo: subida gradual, permanencia a temperatura constante y enfriamiento lento dentro del horno." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Curva de temperatura contra tiempo: subida gradual, permanencia a temperatura constante y enfriamiento lento dentro del horno.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="280" fill="#0e1a21"/><rect width="640" height="280" fill="url(#grid)"/><line x1="70" y1="240" x2="600" y2="240" stroke="#a9bcc7" stroke-width="1.4" marker-end="url(#as)"/><line x1="70" y1="240" x2="70" y2="34" stroke="#a9bcc7" stroke-width="1.4" marker-end="url(#as)"/><path d="M70 220L190 90H400C470 90 520 150 600 214" fill="none" stroke="#e8875b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" /><line x1="70" y1="90" x2="600" y2="90" stroke="#2c4351" stroke-width="1" stroke-dasharray="4 4"/><text x="74" y="82" font-size="13" fill="#7f97a5" text-anchor="start" font-weight="400">Temperatura de recocido (según la ficha)</text><text x="150" y="200" font-size="14" fill="#f0c27a" text-anchor="start" font-weight="400">Sube despacio</text><text x="295" y="116" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">Mantén</text><text x="450" y="196" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">Enfría dentro</text><text x="450" y="214" font-size="14" fill="#f0c27a" text-anchor="middle" font-weight="400">del horno apagado</text><text x="335.0" y="270" font-size="14" fill="#a9bcc7" text-anchor="middle" font-weight="400">Tiempo</text><text x="34" y="140.0" font-size="15" fill="#a9bcc7" text-anchor="middle" transform="rotate(-90 34 140.0)">Temperatura</text></svg>
