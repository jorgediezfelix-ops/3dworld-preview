<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Vista superior de la cama: la pieza, la torre de purga a un lado y la trayectoria de la boquilla que pasa por la torre antes de volver a la pieza." font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Vista superior de la cama: la pieza, la torre de purga a un lado y la trayectoria de la boquilla que pasa por la torre antes de volver a la pieza.</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#14252e" stroke-width="1"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b8daee" stroke-opacity=".38" stroke-width="1.4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8daee"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c27a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9bcc7"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b87f5"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><rect width="640" height="300" fill="#0e1a21"/><rect width="640" height="300" fill="url(#grid)"/><rect x="60" y="40" width="420" height="230" rx="10" fill="#13232c" stroke="#2c4351" stroke-width="1.5" /><rect x="100" y="90" width="150" height="120" rx="14" fill="#2f6fd6" stroke="#b8daee" stroke-width="1.4" fill-opacity=".45"/><text x="175" y="156" font-size="16" fill="#eef4f7" text-anchor="middle" font-weight="600">Pieza</text><rect x="360" y="120" width="60" height="60" rx="4" fill="#f0c27a" stroke="#f0c27a" stroke-width="1.4" fill-opacity=".4"/><path d="M250 130C300 110 330 120 360 134" fill="none" stroke="#f0c27a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#aw)"/><path d="M360 168C330 182 300 190 250 172" fill="none" stroke="#b8daee" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#a)"/><circle cx="420" cy="150" r="2.6" fill="#b8daee" stroke="none" stroke-width="1.5" /><path d="M420 150L494 115" fill="none" stroke="#7f97a5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="500" y="120" font-size="15" fill="#eef4f7" text-anchor="start" font-weight="400">Torre de purga</text><text x="500" y="150" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">Recibe las primeras</text><text x="500" y="168" font-size="13" fill="#a9bcc7" text-anchor="start" font-weight="400">líneas del nuevo color</text><text x="305" y="102" font-size="13" fill="#f0c27a" text-anchor="middle" font-weight="400">Cambio de color</text><text x="305" y="210" font-size="13" fill="#b8daee" text-anchor="middle" font-weight="400">Color limpio</text></svg>
